server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: FinancialRecord-Backend

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# Application Custom Configurations
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

  cookie:
    secure: ${COOKIE_SECURE:false}
  
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      endpoint: https://generativelanguage.googleapis.com/v1beta
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      endpoint: https://api.openai.com/v1
    provider: ${AI_PROVIDER:gemini} # 'gemini' or 'openai' or 'mock'
 
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
    auth-limit-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:10}
    ai-limit-per-minute: ${RATE_LIMIT_AI_PER_MIN:20}
    user-limit-per-minute: ${RATE_LIMIT_USER_PER_MIN:120}
    admin-limit-per-minute: ${RATE_LIMIT_ADMIN_PER_MIN:200}
    public-limit-per-minute: ${RATE_LIMIT_PUBLIC_PER_MIN:300}

# Springdoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.financialrecord: INFO
    org.springframework.security: WARN
