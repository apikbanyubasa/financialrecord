version: '3.8'

services:
  # 1. Primary Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: financialrecord_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financialrecord_db}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-postgres} -d ${POSTGRES_DB:-financialrecord_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financialrecord_network

  # 2. Redis Message Broker & Distributed Cache
  redis:
    image: redis:7-alpine
    container_name: financialrecord_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financialrecord_network

  # 3. Backend API Server (Spring Boot 3.3 Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financialrecord_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-financialrecord_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-enterprise_production_jwt_secret_must_be_at_least_256_bits_long}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - financialrecord_network

  # 4. Frontend Web Client (Next.js 14 Standalone)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financialrecord_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - financialrecord_network

  # 5. Database Web Administration (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: financialrecord_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@financialrecord.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-adminpassword}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - financialrecord_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  financialrecord_network:
    driver: bridge
