<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="200" y1="200" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Logo Mark -->
  <rect x="120" y="140" width="80" height="80" rx="22" fill="url(#primaryGrad)" />
  <circle cx="160" cy="180" r="16" fill="white" fill-opacity="0.25" />
  <circle cx="160" cy="180" r="8" fill="#FDE047" />

  <!-- Badge -->
  <rect x="220" y="155" width="230" height="42" rx="21" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
  <text x="240" y="181" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ENTERPRISE-GRADE AI</text>

  <!-- Title -->
  <text x="120" y="290" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">FinancialRecord</text>

  <!-- Tagline -->
  <text x="120" y="360" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
    Smart Income &amp; Expense Breakdown with Google Gemini 1.5 Flash NLP Engine
  </text>

  <!-- Feature Pills -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">
    <rect x="120" y="430" width="220" height="48" rx="14" fill="#1E293B" stroke="#334155" />
    <text x="145" y="460" fill="#E2E8F0">⚡ Catat Cepat NLP</text>

    <rect x="360" y="430" width="240" height="48" rx="14" fill="#1E293B" stroke="#334155" />
    <text x="385" y="460" fill="#E2E8F0">🎯 Smart Budget Limiter</text>

    <rect x="620" y="430" width="250" height="48" rx="14" fill="#1E293B" stroke="#334155" />
    <text x="645" y="460" fill="#E2E8F0">📊 Arus Kas Multi-Periode</text>
  </g>
</svg>
